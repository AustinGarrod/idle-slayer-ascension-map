name: Validate and publish Companion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node .yarn/releases/yarn-4.13.0.cjs install --immutable
      - run: node .yarn/releases/yarn-4.13.0.cjs validate:catalog
      - run: node .yarn/releases/yarn-4.13.0.cjs typecheck
      - run: node .yarn/releases/yarn-4.13.0.cjs test
      - run: node .yarn/releases/yarn-4.13.0.cjs test:tools
      - run: node .yarn/releases/yarn-4.13.0.cjs build
      - run: node .yarn/releases/yarn-4.13.0.cjs check:release
      - name: Upload GlitchTip release and source maps before publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: node scripts/upload-reporting.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-build
          path: dist/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  browser:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node .yarn/releases/yarn-4.13.0.cjs install --immutable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-build
          path: dist
      - run: node .yarn/releases/yarn-4.13.0.cjs playwright install --with-deps chromium
      - name: Browser regression checks
        id: browser_checks
        run: node .yarn/releases/yarn-4.13.0.cjs test:e2e --shard=${{ matrix.shard }}/4 --workers=2
      - name: Retain failed browser diagnostics
        if: ${{ !cancelled() && steps.browser_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: warn
          include-hidden-files: false
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: [validate, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-build
          path: dist
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
